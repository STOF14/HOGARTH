<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hogarth — Boot Sequence (Stage 1, v2)</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  html,body{margin:0; padding:0; background:#141018; overflow:hidden; height:100%; width:100%;}
  #stage{position:fixed; inset:0;}
  #stage canvas{
    display:block; width:100%; height:100%;
    image-rendering:pixelated; image-rendering:-moz-crisp-edges; image-rendering:crisp-edges;
  }

  .wipe{
    position:fixed; inset:0; pointer-events:none;
    width:100%; height:100%;
    image-rendering:pixelated; image-rendering:-moz-crisp-edges; image-rendering:crisp-edges;
  }
  #redWipe{ z-index:10; }
  #blackWipe{ z-index:11; }

  #skip{
    position:fixed; bottom:28px; right:28px; z-index:50;
    font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.1em; text-transform:uppercase;
    color:rgba(255,255,255,0.5); background:none; border:1px solid rgba(255,255,255,0.25);
    padding:8px 14px; cursor:pointer;
  }
  #skip:hover, #skip:focus-visible{ color:#fff; border-color:rgba(255,255,255,0.6); outline:none; }

  #wordmarkCanvas{
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    width:min(72vw, 640px); height:auto;
    image-rendering:pixelated; image-rendering:-moz-crisp-edges; image-rendering:crisp-edges;
    opacity:0; transition:opacity 1.4s ease; z-index:20; pointer-events:none;
  }
  #enterHint{
    position:fixed; bottom:14%; left:50%; transform:translate(-50%,0);
    font-family:'IBM Plex Mono', monospace; font-size:11px;
    letter-spacing:0.14em; text-transform:uppercase; color:rgba(240,236,226,0.55);
    opacity:0; transition:opacity 1s ease; z-index:20; pointer-events:none;
  }

  @media (prefers-reduced-motion: reduce){
    #stage{display:none;}
    #blackWipe{ background:#0a0810; opacity:1 !important; }
  }
</style>
</head>
<body>

<div id="stage"></div>
<canvas id="redWipe" class="wipe" width="64" height="36"></canvas>
<canvas id="blackWipe" class="wipe" width="64" height="36"></canvas>
<canvas id="wordmarkCanvas" width="220" height="40"></canvas>
<div id="enterHint">click anywhere to continue</div>
<button id="skip" type="button">Skip →</button>

<script>
(function(){
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const stageEl = document.getElementById('stage');
  const redWipeCanvas = document.getElementById('redWipe');
  const blackWipeCanvas = document.getElementById('blackWipe');
  const wordmarkCanvas = document.getElementById('wordmarkCanvas');
  const enterHint = document.getElementById('enterHint');
  const skipBtn = document.getElementById('skip');

  // ---------- pixel wordmark, drawn once ----------
  (function drawWordmark(){
    const ctx = wordmarkCanvas.getContext('2d');
    ctx.clearRect(0,0,wordmarkCanvas.width,wordmarkCanvas.height);
    ctx.fillStyle = '#f0ece2';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `20px "Press Start 2P", monospace`;
    ctx.fillText('HOGARTH', wordmarkCanvas.width/2, wordmarkCanvas.height/2 + 2);
  })();
  // Fonts can load async; redraw once the pixel font is confirmed ready.
  if (document.fonts && document.fonts.ready){
    document.fonts.load('20px "Press Start 2P"').then(() => {
      const ctx = wordmarkCanvas.getContext('2d');
      ctx.clearRect(0,0,wordmarkCanvas.width,wordmarkCanvas.height);
      ctx.fillStyle = '#f0ece2';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = `20px "Press Start 2P", monospace`;
      ctx.fillText('HOGARTH', wordmarkCanvas.width/2, wordmarkCanvas.height/2 + 2);
    }).catch(()=>{});
  }

  // ---------- pixel dissolve wipes ----------
  function hexToRGB(hex){
    return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
  }
  function makeThresholds(cols, rows){
    const arr = new Float32Array(cols*rows);
    for (let i=0;i<arr.length;i++) arr[i] = Math.random();
    return arr;
  }
  const WIPE_COLS = 64, WIPE_ROWS = 36;
  const redThresh = makeThresholds(WIPE_COLS, WIPE_ROWS);
  const blackThresh = makeThresholds(WIPE_COLS, WIPE_ROWS);

  function paintWipe(canvas, thresholds, colorRGB, coverage){
    const ctx = canvas.getContext('2d');
    const img = ctx.createImageData(canvas.width, canvas.height);
    for (let i=0;i<thresholds.length;i++){
      const idx = i*4;
      if (thresholds[i] <= coverage){
        img.data[idx]=colorRGB[0]; img.data[idx+1]=colorRGB[1]; img.data[idx+2]=colorRGB[2]; img.data[idx+3]=255;
      } else {
        img.data[idx+3]=0;
      }
    }
    ctx.putImageData(img,0,0);
  }

  function animateWipe(canvas, thresholds, colorRGB, durationMs, onDone){
    const start = performance.now();
    function step(now){
      const t = Math.min((now-start)/durationMs, 1);
      paintWipe(canvas, thresholds, colorRGB, t);
      if (t < 1) requestAnimationFrame(step);
      else if (onDone) onDone();
    }
    requestAnimationFrame(step);
  }

  const RED_RGB = hexToRGB('#a01414');
  const BLACK_RGB = hexToRGB('#0a0810');

  let finished = false;
  function finish(){
    if (finished) return;
    finished = true;
    paintWipe(redWipeCanvas, redThresh, RED_RGB, 0);
    paintWipe(blackWipeCanvas, blackThresh, BLACK_RGB, 1);
    wordmarkCanvas.style.opacity = '0.95';
    enterHint.style.opacity = '1';
    skipBtn.style.display = 'none';
  }
  skipBtn.addEventListener('click', finish);
  if (reduceMotion){ finish(); return; }

  // ---------- low-res 3D pixel render pipeline ----------
  const PIXEL_SCALE = 1/7;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x171220);
  const camera = new THREE.PerspectiveCamera(46, window.innerWidth/window.innerHeight, 0.1, 100);
  const camBase = new THREE.Vector3(0,0,9);
  camera.position.copy(camBase);

  const renderer = new THREE.WebGLRenderer({ antialias:false });
  renderer.setPixelRatio(1);
  stageEl.appendChild(renderer.domElement);

  function resize(){
    const w = Math.max(64, Math.floor(window.innerWidth * PIXEL_SCALE));
    const h = Math.max(48, Math.floor(window.innerHeight * PIXEL_SCALE));
    renderer.setSize(w, h, false);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
  }
  resize();
  window.addEventListener('resize', resize);

  scene.add(new THREE.AmbientLight(0x2a2436, 1.1));
  const key = new THREE.PointLight(0xfff2d8, 1.6, 40); key.position.set(5,3,7); scene.add(key);
  const rim = new THREE.PointLight(0x6a4fd9, 0.6, 40); rim.position.set(-6,-2,-3); scene.add(rim);

  // ---------- procedural planet textures (also keep raw canvases for color sampling) ----------
  function makePlanetTexture(kind){
    const size = 40;
    const canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext('2d');
    const img = ctx.createImageData(size, size);
    const cx = size/2, cy = size/2, r = size/2 - 1;
    const palettes = {
      rock: ['#6b6373', '#847c8f', '#4d4757', '#a89fb0', '#38333f'],
      lava: ['#2a1210', '#4a1a12', '#7a2814', '#c94a1a', '#f2812e']
    };
    const pal = palettes[kind];
    for (let y=0;y<size;y++){
      for (let x=0;x<size;x++){
        const dx=x-cx, dy=y-cy, dist=Math.sqrt(dx*dx+dy*dy);
        const i=(y*size+x)*4;
        if (dist > r){ img.data[i+3]=0; continue; }
        const lightAmt = Math.max(0, (-dx-dy)/size);
        let colorIdx;
        if (kind==='rock'){
          const n = Math.sin(x*0.9)*Math.cos(y*0.7)+Math.sin((x+y)*0.35);
          colorIdx = Math.min(pal.length-1, Math.max(0, Math.round(2 - lightAmp*3 + n*0.6)));
        } else {
          const n = Math.sin(x*0.5+y*0.9)+Math.sin(x*1.3-y*0.4);
          colorIdx = Math.min(pal.length-1, Math.max(0, Math.round(1.5 + n*1.4 + lightAmp*1.2)));
        }
        const hex = pal[colorIdx];
        img.data[i]=parseInt(hex.slice(1,3),16);
        img.data[i+1]=parseInt(hex.slice(3,5),16);
        img.data[i+2]=parseInt(hex.slice(5,7),16);
        img.data[i+3]=255;
      }
    }
    ctx.putImageData(img,0,0);
    const tex = new THREE.CanvasTexture(canvas);
    tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter; tex.needsUpdate = true;
    return { texture: tex, canvas, size };
  }

  function sampleOpaqueColors(sourceCanvas, size, count){
    const ctx = sourceCanvas.getContext('2d');
    const data = ctx.getImageData(0,0,size,size).data;
    const colors = [];
    let attempts = 0;
    while (colors.length < count && attempts < count*20){
      attempts++;
      const x = Math.floor(Math.random()*size), y = Math.floor(Math.random()*size);
      const i = (y*size+x)*4;
      if (data[i+3] > 200){
        colors.push(`#${data[i].toString(16).padStart(2,'0')}${data[i+1].toString(16).padStart(2,'0')}${data[i+2].toString(16).padStart(2,'0')}`);
      }
    }
    return colors.length ? colors : ['#c94a1a'];
  }

  function makeFlashTexture(){
    const size = 24;
    const canvas = document.createElement('canvas'); canvas.width=size; canvas.height=size;
    const ctx = canvas.getContext('2d');
    const img = ctx.createImageData(size,size);
    const cx=size/2, cy=size/2, r=size/2-1;
    for (let y=0;y<size;y++){ for (let x=0;x<size;x++){
      const dist=Math.hypot(x-cx,y-cy); const i=(y*size+x)*4;
      if (dist>r){ img.data[i+3]=0; continue; }
      const ring = dist/r;
      const hex = ring<0.55 ? '#fff6dd' : (ring<0.8 ? '#ffcf6b' : '#f2812e');
      img.data[i]=parseInt(hex.slice(1,3),16); img.data[i+1]=parseInt(hex.slice(3,5),16); img.data[i+2]=parseInt(hex.slice(5,7),16); img.data[i+3]=255;
    }}
    ctx.putImageData(img,0,0);
    const tex = new THREE.CanvasTexture(canvas);
    tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter;
    return tex;
  }

  function makeParticleTexture(hex){
    const size = 6;
    const canvas = document.createElement('canvas'); canvas.width=size; canvas.height=size;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = hex; ctx.fillRect(0,0,size,size);
    const tex = new THREE.CanvasTexture(canvas);
    tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter;
    return tex;
  }

  // stars
  const starGeo = new THREE.BufferGeometry();
  const starCount = 140;
  const starPos = new Float32Array(starCount*3);
  for (let i=0;i<starCount;i++){
    starPos[i*3]=(Math.random()-0.5)*40; starPos[i*3+1]=(Math.random()-0.5)*24; starPos[i*3+2]=-10-Math.random()*15;
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPos,3));
  const starMat = new THREE.PointsMaterial({ size:0.12, map:makeParticleTexture('#e8e2f0'), transparent:true, depthWrite:false, sizeAttenuation:true });
  scene.add(new THREE.Points(starGeo, starMat));

  const rockData = makePlanetTexture('rock');
  const lavaData = makePlanetTexture('lava');
  const rockDebrisColors = sampleOpaqueColors(rockData.canvas, rockData.size, 6);
  const lavaDebrisColors = sampleOpaqueColors(lavaData.canvas, lavaData.size, 6);

  const RADIUS_A = 1.6, RADIUS_B = 1.15;
  const bodyA = new THREE.Sprite(new THREE.SpriteMaterial({ map: rockData.texture, transparent:true }));
  bodyA.scale.set(RADIUS_A*2, RADIUS_A*2, 1);
  const startA = new THREE.Vector3(-6, -1.2, 0);
  bodyA.position.copy(startA);
  scene.add(bodyA);

  const bodyB = new THREE.Sprite(new THREE.SpriteMaterial({ map: lavaData.texture, transparent:true }));
  bodyB.scale.set(RADIUS_B*2, RADIUS_B*2, 1);
  const startB = new THREE.Vector3(6, 1.5, -1);
  bodyB.position.copy(startB);
  scene.add(bodyB);

  // Contact geometry: bodies stop when their edges actually touch,
  // not when their centers coincide — this is what reads as a crash
  // rather than one absorbing the other.
  const impactCenter = new THREE.Vector3(0, 0.1, -0.4);
  const dir = new THREE.Vector3().subVectors(startB, startA).normalize();
  const finalA = impactCenter.clone().addScaledVector(dir, -RADIUS_A);
  const finalB = impactCenter.clone().addScaledVector(dir, RADIUS_B);

  const flash = new THREE.Sprite(new THREE.SpriteMaterial({ map: makeFlashTexture(), transparent:true, opacity:0 }));
  flash.scale.set(0.6,0.6,1);
  flash.position.copy(impactCenter);
  scene.add(flash);

  // debris built from sampled planet colors
  const PARTICLE_COUNT = 80;
  const debrisSprites = [];
  const debrisVel = [];
  for (let i=0;i<PARTICLE_COUNT;i++){
    const fromRock = i % 2 === 0;
    const palette = fromRock ? rockDebrisColors : lavaDebrisColors;
    const hex = palette[Math.floor(Math.random()*palette.length)];
    const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: makeParticleTexture(hex), transparent:true, opacity:0 }));
    spr.scale.set(0.2 + Math.random()*0.14, 0.2 + Math.random()*0.14, 1);
    spr.position.copy(impactCenter);
    scene.add(spr);
    debrisSprites.push(spr);
    const theta = Math.random()*Math.PI*2;
    const speed = 2.2 + Math.random()*5.2;
    debrisVel.push(new THREE.Vector3(Math.cos(theta)*speed, Math.sin(theta)*speed, (Math.random()-0.5)*2.2));
  }

  // small contact sparks that fire right at the moment of touch, before the full explosion
  const SPARK_COUNT = 14;
  const sparkSprites = [];
  const sparkVel = [];
  for (let i=0;i<SPARK_COUNT;i++){
    const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: makeParticleTexture('#fff6dd'), transparent:true, opacity:0 }));
    spr.scale.set(0.14,0.14,1);
    spr.position.copy(impactCenter);
    scene.add(spr);
    sparkSprites.push(spr);
    const theta = Math.random()*Math.PI*2;
    sparkVel.push(new THREE.Vector3(Math.cos(theta)*1.8, Math.sin(theta)*1.8, (Math.random()-0.5)*1.2));
  }

  let phase = 'approach';
  let phaseStart = performance.now();
  const APPROACH_MS = 2100;
  const IMPACT_MS = 170;
  const EXPLODE_MS = 950;
  function easeInOutCubic(t){ return t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }
  function easeOutQuad(t){ return 1 - (1-t)*(1-t); }

  function animate(now){
    if (finished) return;
    requestAnimationFrame(animate);
    const elapsed = now - phaseStart;

    if (phase === 'approach'){
      const t = Math.min(elapsed/APPROACH_MS, 1);
      const e = easeInOutCubic(t);
      bodyA.position.lerpVectors(startA, finalA, e);
      bodyB.position.lerpVectors(startB, finalB, e);
      camera.position.set(camBase.x, camBase.y, camBase.z - e*1.2);
      if (t >= 1){
        phase = 'impact'; phaseStart = now;
        sparkSprites.forEach(s => s.material.opacity = 1);
      }
    } else if (phase === 'impact'){
      const t = Math.min(elapsed/IMPACT_MS, 1);
      // squash both bodies along the contact axis, bulge perpendicular
      const squash = 1 - 0.35*Math.sin(t*Math.PI);
      const bulge = 1 + 0.25*Math.sin(t*Math.PI);
      bodyA.scale.set(RADIUS_A*2*bulge, RADIUS_A*2*squash, 1);
      bodyB.scale.set(RADIUS_B*2*bulge, RADIUS_B*2*squash, 1);
      // camera shake
      const shake = (1-t) * 0.09;
      camera.position.x = camBase.x + (Math.random()-0.5)*shake;
      camera.position.y = camBase.y + (Math.random()-0.5)*shake;
      // sparks jitter outward slightly at the seam
      const dt = elapsed/1000;
      for (let i=0;i<SPARK_COUNT;i++){
        sparkSprites[i].position.set(
          impactCenter.x + sparkVel[i].x*dt,
          impactCenter.y + sparkVel[i].y*dt,
          impactCenter.z + sparkVel[i].z*dt
        );
        sparkSprites[i].material.opacity = Math.max(0, 1-t);
      }
      if (t >= 1){
        phase = 'explode'; phaseStart = now;
        bodyA.visible = false; bodyB.visible = false;
        flash.material.opacity = 1;
        debrisSprites.forEach(s => s.material.opacity = 1);
        sparkSprites.forEach(s => s.material.opacity = 0);
      }
    } else if (phase === 'explode'){
      const t = Math.min(elapsed/EXPLODE_MS, 1);
      const dt = elapsed/1000;
      for (let i=0;i<PARTICLE_COUNT;i++){
        debrisSprites[i].position.set(
          impactCenter.x + debrisVel[i].x*dt,
          impactCenter.y + debrisVel[i].y*dt,
          impactCenter.z + debrisVel[i].z*dt
        );
        debrisSprites[i].material.opacity = Math.max(0, 1-t);
      }
      flash.material.opacity = Math.max(0, 1 - t*1.5);
      flash.scale.setScalar(3.4 + t*4);

      if (t > 0.3 && !redWipeCanvas.dataset.started){
        redWipeCanvas.dataset.started = '1';
        animateWipe(redWipeCanvas, redThresh, RED_RGB, 520, () => {
          setTimeout(() => {
            animateWipe(blackWipeCanvas, blackThresh, BLACK_RGB, 520, finish);
          }, 220);
        });
      }
      if (t >= 1){ phase = 'done'; }
    }

    renderer.render(scene, camera);
  }
  requestAnimationFrame(animate);

  document.addEventListener('click', (e) => {
    if (e.target === skipBtn) return;
    finish();
  });
})();
</script>

</body>
</html>
