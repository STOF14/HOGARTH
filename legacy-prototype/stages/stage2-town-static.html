<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hogarth — Town Map (Stage 2, Static)</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  html,body{margin:0; padding:0; background:#0c0a12; overflow:hidden; height:100%; width:100%;}
  #stage{position:fixed; inset:0;}
  #stage canvas{
    display:block; width:100%; height:100%;
    image-rendering:pixelated; image-rendering:-moz-crisp-edges; image-rendering:crisp-edges;
  }
  #hud{
    position:fixed; top:20px; left:20px; z-index:20;
    font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.08em;
    text-transform:uppercase; color:rgba(240,236,226,0.65);
  }
  #hud .dim{opacity:0.5;}
  #tooltip{
    position:fixed; z-index:30; pointer-events:none;
    font-family:'IBM Plex Mono', monospace; font-size:11px;
    background:rgba(10,8,16,0.85); color:#f0ece2; border:1px solid rgba(240,236,226,0.25);
    padding:6px 10px; opacity:0; transition:opacity 0.15s ease; white-space:nowrap;
  }
</style>
</head>
<body>

<div id="stage"></div>
<div id="hud">HOGARTH <span class="dim">/ town — 6 plots, 0 lit</span></div>
<div id="tooltip"></div>

<script>
(function(){
  const stageEl = document.getElementById('stage');
  const tooltip = document.getElementById('tooltip');
  const hud = document.getElementById('hud');

  // ---------- shared pixel helpers (same technique as boot sequence) ----------
  function hexToInts(hex){
    return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
  }
  function makeNearestTexture(canvas, repeatX, repeatY){
    const tex = new THREE.CanvasTexture(canvas);
    tex.magFilter = THREE.NearestFilter;
    tex.minFilter = THREE.NearestFilter;
    if (repeatX || repeatY){
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(repeatX||1, repeatY||1);
    }
    return tex;
  }

  // tileable grass/dirt ground texture
  function makeGroundTexture(){
    const size = 16;
    const canvas = document.createElement('canvas'); canvas.width=size; canvas.height=size;
    const ctx = canvas.getContext('2d');
    const img = ctx.createImageData(size,size);
    const base = ['#3c5a3e', '#456647', '#345036', '#4d6f4f'];
    for (let y=0;y<size;y++){ for (let x=0;x<size;x++){
      const n = Math.sin(x*1.7)*Math.cos(y*1.3) + Math.sin((x+y)*0.9);
      const idx = Math.min(base.length-1, Math.max(0, Math.round((n+1.4)/0.9)));
      const [r,g,b] = hexToInts(base[idx]);
      const i=(y*size+x)*4;
      img.data[i]=r; img.data[i+1]=g; img.data[i+2]=b; img.data[i+3]=255;
    }}
    ctx.putImageData(img,0,0);
    return canvas;
  }

  function makeStreetTexture(){
    const size = 16;
    const canvas = document.createElement('canvas'); canvas.width=size; canvas.height=size;
    const ctx = canvas.getContext('2d');
    const img = ctx.createImageData(size,size);
    const base = ['#5a5560', '#65606c', '#4d4954'];
    for (let y=0;y<size;y++){ for (let x=0;x<size;x++){
      const n = Math.sin(x*2.1+y*0.4);
      const idx = Math.min(base.length-1, Math.max(0, Math.round((n+1)/0.9)));
      const [r,g,b] = hexToInts(base[idx]);
      const i=(y*size+x)*4;
      img.data[i]=r; img.data[i+1]=g; img.data[i+2]=b; img.data[i+3]=255;
    }}
    ctx.putImageData(img,0,0);
    return canvas;
  }

  // small building facade texture, color-varied per plot
  function makeBuildingTexture(baseHex, accentHex){
    const size = 16;
    const canvas = document.createElement('canvas'); canvas.width=size; canvas.height=size;
    const ctx = canvas.getContext('2d');
    const img = ctx.createImageData(size,size);
    const [br,bg,bb] = hexToInts(baseHex);
    const [ar,ag,ab] = hexToInts(accentHex);
    for (let y=0;y<size;y++){ for (let x=0;x<size;x++){
      const i=(y*size+x)*4;
      const isDoor = x>=6 && x<=9 && y>=9;
      const isWindow = (x===3||x===12) && y>=3 && y<=6;
      const brickLine = (y%4===0);
      let r=br,g=bg,b=bb;
      if (isDoor){ r=30; g=22; b=18; }
      else if (isWindow){ r=ar; g=ag; b=ab; }
      else if (brickLine){ r=Math.max(0,br-18); g=Math.max(0,bg-18); b=Math.max(0,bb-18); }
      img.data[i]=r; img.data[i+1]=g; img.data[i+2]=b; img.data[i+3]=255;
    }}
    ctx.putImageData(img,0,0);
    return canvas;
  }

  function makeStarTexture(){
    const size=6;
    const canvas=document.createElement('canvas'); canvas.width=size; canvas.height=size;
    const ctx=canvas.getContext('2d'); ctx.fillStyle='#e8e2f0'; ctx.fillRect(0,0,size,size);
    return canvas;
  }

  // ---------- scene / camera / renderer ----------
  const PIXEL_SCALE = 1/6;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x14101c);
  scene.fog = new THREE.Fog(0x14101c, 22, 40);

  const aspect = window.innerWidth/window.innerHeight;
  const viewSize = 13;
  const camera = new THREE.OrthographicCamera(
    -viewSize*aspect, viewSize*aspect, viewSize, -viewSize, 0.1, 100
  );
  camera.position.set(16, 14, 16);
  camera.lookAt(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({ antialias:false });
  renderer.setPixelRatio(1);
  stageEl.appendChild(renderer.domElement);

  function resize(){
    const w = Math.max(64, Math.floor(window.innerWidth * PIXEL_SCALE));
    const h = Math.max(48, Math.floor(window.innerHeight * PIXEL_SCALE));
    renderer.setSize(w, h, false);
    const a = window.innerWidth/window.innerHeight;
    camera.left = -viewSize*a; camera.right = viewSize*a;
    camera.top = viewSize; camera.bottom = -viewSize;
    camera.updateProjectionMatrix();
  }
  resize();
  window.addEventListener('resize', resize);

  // ---------- lighting ----------
  scene.add(new THREE.AmbientLight(0x2e2a3c, 1.2));
  const moon = new THREE.DirectionalLight(0xcfd0ff, 0.75);
  moon.position.set(-8, 12, 6);
  scene.add(moon);
  const warmFill = new THREE.PointLight(0x6a4fd9, 0.4, 30);
  warmFill.position.set(6, 4, -6);
  scene.add(warmFill);

  // ---------- ground ----------
  const groundTex = makeNearestTexture(makeGroundTexture(), 10, 10);
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(24, 24),
    new THREE.MeshStandardMaterial({ map: groundTex, roughness:1 })
  );
  ground.rotation.x = -Math.PI/2;
  scene.add(ground);

  // main street, straight down the middle (Z axis)
  const streetTex = makeNearestTexture(makeStreetTexture(), 2, 12);
  const street = new THREE.Mesh(
    new THREE.PlaneGeometry(3, 22),
    new THREE.MeshStandardMaterial({ map: streetTex, roughness:1 })
  );
  street.rotation.x = -Math.PI/2;
  street.position.y = 0.01;
  scene.add(street);

  // ---------- plots ----------
  const plotPalette = [
    ['#8a4a3a', '#f2d98a'], // practice - warm brick
    ['#3a5a7a', '#f2d98a'], // history - blue
    ['#5a4a7a', '#f2d98a'], // inspiration - purple
    ['#4a7a5a', '#f2d98a'], // works - green
    ['#7a5a3a', '#f2d98a'], // practice
    ['#7a3a5a', '#f2d98a'], // history
  ];

  const plotGroup = new THREE.Group();
  scene.add(plotGroup);

  const plots = [];
  const zSpacing = 6;
  for (let i=0;i<6;i++){
    const side = i % 2 === 0 ? -1 : 1; // alternate left/right of street
    const row = Math.floor(i/2);
    const x = side * 5.5;
    const z = -6 + row * zSpacing;

    const g = new THREE.Group();
    g.position.set(x, 0, z);

    // base platform
    const base = new THREE.Mesh(
      new THREE.BoxGeometry(2.6, 0.15, 2.6),
      new THREE.MeshStandardMaterial({ color: 0x2a2634, roughness:1 })
    );
    base.position.y = 0.075;
    g.add(base);

    // building
    const [baseHex, accentHex] = plotPalette[i];
    const facadeTex = makeNearestTexture(makeBuildingTexture(baseHex, accentHex));
    const building = new THREE.Mesh(
      new THREE.BoxGeometry(1.6, 1.6, 1.6),
      new THREE.MeshStandardMaterial({ map: facadeTex, roughness:0.9 })
    );
    building.position.y = 0.15 + 0.8;
    g.add(building);

    // pyramid roof
    const roof = new THREE.Mesh(
      new THREE.ConeGeometry(1.3, 0.9, 4),
      new THREE.MeshStandardMaterial({ color: 0x1c1822, roughness:1 })
    );
    roof.rotation.y = Math.PI/4;
    roof.position.y = 0.15 + 1.6 + 0.45;
    g.add(roof);

    // lamp post, positioned toward the street side of the plot
    const lampGroup = new THREE.Group();
    lampGroup.position.set(-side * 1.7, 0, 0.9);
    const pole = new THREE.Mesh(
      new THREE.CylinderGeometry(0.05, 0.06, 1.8, 6),
      new THREE.MeshStandardMaterial({ color: 0x1c1822, roughness:0.8 })
    );
    pole.position.y = 0.9;
    lampGroup.add(pole);

    const bulbMat = new THREE.MeshStandardMaterial({
      color: 0x3a3640, emissive: 0x000000, emissiveIntensity: 0, roughness:0.5
    });
    const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.16, 8, 8), bulbMat);
    bulb.position.y = 1.85;
    lampGroup.add(bulb);

    const glowLight = new THREE.PointLight(0xffcf8a, 0, 4);
    glowLight.position.y = 1.85;
    lampGroup.add(glowLight);

    g.add(lampGroup);

    plotGroup.add(g);
    plots.push({
      group: g, building, roof, bulbMat, glowLight,
      lit: false, index: i,
      label: `Plot ${i+1} — empty`
    });
  }

  // background stars (reused visual language from boot sequence)
  const starGeo = new THREE.BufferGeometry();
  const starCount = 120;
  const starPos = new Float32Array(starCount*3);
  for (let i=0;i<starCount;i++){
    starPos[i*3]=(Math.random()-0.5)*50;
    starPos[i*3+1]=6+Math.random()*14;
    starPos[i*3+2]=(Math.random()-0.5)*50;
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPos,3));
  const starMat = new THREE.PointsMaterial({
    size:0.1, map: makeNearestTexture(makeStarTexture()), transparent:true, depthWrite:false
  });
  scene.add(new THREE.Points(starGeo, starMat));

  // ---------- hover interaction (groundwork for stage 5, no reader yet) ----------
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  let hovered = null;

  function onMove(e){
    const rect = renderer.domElement.getBoundingClientRect();
    mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    tooltip.style.left = (e.clientX + 14) + 'px';
    tooltip.style.top = (e.clientY + 14) + 'px';
  }
  window.addEventListener('mousemove', onMove);
  window.addEventListener('click', () => {
    if (hovered) console.log('Would open reader for:', hovered.label, '(wired in Stage 5)');
  });

  function updateHover(){
    raycaster.setFromCamera(mouse, camera);
    const targets = plots.map(p => p.building);
    const hits = raycaster.intersectObjects(targets);
    if (hits.length){
      const hitPlot = plots.find(p => p.building === hits[0].object);
      if (hovered !== hitPlot){
        if (hovered) hovered.group.scale.set(1,1,1);
        hovered = hitPlot;
      }
      hovered.group.scale.set(1.05,1.05,1.05);
      tooltip.textContent = hovered.label;
      tooltip.style.opacity = '1';
    } else {
      if (hovered) hovered.group.scale.set(1,1,1);
      hovered = null;
      tooltip.style.opacity = '0';
    }
  }

  // ---------- render loop ----------
  function animate(){
    requestAnimationFrame(animate);
    updateHover();
    renderer.render(scene, camera);
  }
  animate();
})();
</script>

</body>
</html>
