<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hogarth — Town Map (Stage 3, Dynamic Placement)</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  html,body{margin:0; padding:0; background:#0c0a12; overflow:hidden; height:100%; width:100%;}
  #stage{position:fixed; inset:0;}
  #stage canvas{
    display:block; width:100%; height:100%;
    image-rendering:pixelated; image-rendering:-moz-crisp-edges; image-rendering:crisp-edges;
  }
  #hud{
    position:fixed; top:20px; left:20px; z-index:20;
    font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.08em;
    text-transform:uppercase; color:rgba(240,236,226,0.75);
    display:flex; flex-direction:column; gap:10px;
  }
  #hud .title{color:#f0ece2;}
  #hud .dim{opacity:0.55;}
  #controls{ display:flex; gap:8px; }
  #controls button{
    font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:0.06em; text-transform:uppercase;
    background:rgba(20,16,28,0.7); color:#f0ece2; border:1px solid rgba(240,236,226,0.3);
    padding:8px 12px; cursor:pointer;
  }
  #controls button:hover, #controls button:focus-visible{ background:rgba(240,236,226,0.12); outline:none; }
  #tooltip{
    position:fixed; z-index:30; pointer-events:none;
    font-family:'IBM Plex Mono', monospace; font-size:11px;
    background:rgba(10,8,16,0.85); color:#f0ece2; border:1px solid rgba(240,236,226,0.25);
    padding:6px 10px; opacity:0; transition:opacity 0.15s ease; white-space:nowrap;
  }
</style>
</head>
<body>

<div id="stage"></div>
<div id="hud">
  <div><span class="title">HOGARTH</span> <span class="dim" id="hudCount">/ town — 0 plots, 0 lit</span></div>
  <div id="controls">
    <button id="addOne" type="button">+ Add comic (mock)</button>
    <button id="addSix" type="button">+ Add 6 (fill a row)</button>
  </div>
</div>
<div id="tooltip"></div>

<script>
(function(){
  const stageEl = document.getElementById('stage');
  const tooltip = document.getElementById('tooltip');
  const hudCount = document.getElementById('hudCount');

  // ---------- pixel texture helpers ----------
  function hexToInts(hex){
    return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
  }
  function makeNearestTexture(canvas){
    const tex = new THREE.CanvasTexture(canvas);
    tex.magFilter = THREE.NearestFilter;
    tex.minFilter = THREE.NearestFilter;
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.RepeatWrapping;
    return tex;
  }
  function hslToHex(h, s, l){
    s/=100; l/=100;
    const k = n => (n + h/30) % 12;
    const a = s * Math.min(l, 1-l);
    const f = n => l - a * Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n), 1)));
    const toHex = x => Math.round(x*255).toString(16).padStart(2,'0');
    return `#${toHex(f(0))}${toHex(f(8))}${toHex(f(4))}`;
  }
  function hashHue(str){
    let h = 0;
    for (let i=0;i<str.length;i++) h = (h*31 + str.charCodeAt(i)) >>> 0;
    return h % 360;
  }

  function makeGroundTexture(){
    const size = 16;
    const canvas = document.createElement('canvas'); canvas.width=size; canvas.height=size;
    const ctx = canvas.getContext('2d');
    const img = ctx.createImageData(size,size);
    const base = ['#3c5a3e', '#456647', '#345036', '#4d6f4f'];
    for (let y=0;y<size;y++){ for (let x=0;x<size;x++){
      const n = Math.sin(x*1.7)*Math.cos(y*1.3) + Math.sin((x+y)*0.9);
      const idx = Math.min(base.length-1, Math.max(0, Math.round((n+1.4)/0.9)));
      const [r,g,b] = hexToInts(base[idx]);
      const i=(y*size+x)*4;
      img.data[i]=r; img.data[i+1]=g; img.data[i+2]=b; img.data[i+3]=255;
    }}
    ctx.putImageData(img,0,0);
    return canvas;
  }
  function makeStreetTexture(){
    const size = 16;
    const canvas = document.createElement('canvas'); canvas.width=size; canvas.height=size;
    const ctx = canvas.getContext('2d');
    const img = ctx.createImageData(size,size);
    const base = ['#5a5560', '#65606c', '#4d4954'];
    for (let y=0;y<size;y++){ for (let x=0;x<size;x++){
      const n = Math.sin(x*2.1+y*0.4);
      const idx = Math.min(base.length-1, Math.max(0, Math.round((n+1)/0.9)));
      const [r,g,b] = hexToInts(base[idx]);
      const i=(y*size+x)*4;
      img.data[i]=r; img.data[i+1]=g; img.data[i+2]=b; img.data[i+3]=255;
    }}
    ctx.putImageData(img,0,0);
    return canvas;
  }
  function makeBuildingTexture(baseHex, accentHex){
    const size = 16;
    const canvas = document.createElement('canvas'); canvas.width=size; canvas.height=size;
    const ctx = canvas.getContext('2d');
    const img = ctx.createImageData(size,size);
    const [br,bg,bb] = hexToInts(baseHex);
    const [ar,ag,ab] = hexToInts(accentHex);
    for (let y=0;y<size;y++){ for (let x=0;x<size;x++){
      const i=(y*size+x)*4;
      const isDoor = x>=6 && x<=9 && y>=9;
      const isWindow = (x===3||x===12) && y>=3 && y<=6;
      const brickLine = (y%4===0);
      let r=br,g=bg,b=bb;
      if (isDoor){ r=30; g=22; b=18; }
      else if (isWindow){ r=ar; g=ag; b=ab; }
      else if (brickLine){ r=Math.max(0,br-18); g=Math.max(0,bg-18); b=Math.max(0,bb-18); }
      img.data[i]=r; img.data[i+1]=g; img.data[i+2]=b; img.data[i+3]=255;
    }}
    ctx.putImageData(img,0,0);
    return canvas;
  }
  function makeStarTexture(){
    const size=6;
    const canvas=document.createElement('canvas'); canvas.width=size; canvas.height=size;
    const ctx=canvas.getContext('2d'); ctx.fillStyle='#e8e2f0'; ctx.fillRect(0,0,size,size);
    return canvas;
  }

  // ---------- scene / camera / renderer ----------
  const PIXEL_SCALE = 1/6;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x14101c);
  scene.fog = new THREE.Fog(0x14101c, 24, 46);

  const camera = new THREE.OrthographicCamera(-1,1,1,-1,0.1,200);
  const renderer = new THREE.WebGLRenderer({ antialias:false });
  renderer.setPixelRatio(1);
  stageEl.appendChild(renderer.domElement);

  function resizeRenderer(){
    const w = Math.max(64, Math.floor(window.innerWidth * PIXEL_SCALE));
    const h = Math.max(48, Math.floor(window.innerHeight * PIXEL_SCALE));
    renderer.setSize(w, h, false);
  }
  window.addEventListener('resize', () => { resizeRenderer(); updateCameraFit(); });
  resizeRenderer();

  scene.add(new THREE.AmbientLight(0x2e2a3c, 1.2));
  const moon = new THREE.DirectionalLight(0xcfd0ff, 0.75);
  moon.position.set(-8, 12, 6);
  scene.add(moon);
  const warmFill = new THREE.PointLight(0x6a4fd9, 0.4, 30);
  warmFill.position.set(6, 4, -6);
  scene.add(warmFill);

  const groundTexBase = makeGroundTexture();
  const streetTexBase = makeStreetTexture();
  const groundMat = new THREE.MeshStandardMaterial({ map: makeNearestTexture(groundTexBase), roughness:1 });
  const streetMat = new THREE.MeshStandardMaterial({ map: makeNearestTexture(streetTexBase), roughness:1 });

  let groundMesh = null, streetMesh = null;
  const zSpacing = 6;
  const rowStartZ = -6;

  function rebuildGroundAndStreet(rows){
    if (groundMesh){ scene.remove(groundMesh); groundMesh.geometry.dispose(); }
    if (streetMesh){ scene.remove(streetMesh); streetMesh.geometry.dispose(); }
    const minZ = rowStartZ - 5;
    const maxZ = rowStartZ + (rows-1)*zSpacing + 5;
    const length = maxZ - minZ;
    const centerZ = (minZ + maxZ) / 2;

    groundMat.map.repeat.set(10, length/2.4);
    streetMat.map.repeat.set(2, length/1.83);

    groundMesh = new THREE.Mesh(new THREE.PlaneGeometry(24, length), groundMat);
    groundMesh.rotation.x = -Math.PI/2;
    groundMesh.position.z = centerZ;
    scene.add(groundMesh);

    streetMesh = new THREE.Mesh(new THREE.PlaneGeometry(3, length), streetMat);
    streetMesh.rotation.x = -Math.PI/2;
    streetMesh.position.y = 0.01;
    streetMesh.position.z = centerZ;
    scene.add(streetMesh);
  }

  let builtRows = 0;
  function updateCameraFit(){
    const rows = Math.max(1, builtRows);
    const midZ = rowStartZ + (rows-1) * (zSpacing/2);
    const vs = 11 + rows * 2.0;
    const a = window.innerWidth / window.innerHeight;
    camera.left = -vs*a; camera.right = vs*a; camera.top = vs; camera.bottom = -vs;
    const dist = 15 + rows * 2.0;
    camera.position.set(dist, dist*0.875, dist*0.6 + midZ);
    camera.lookAt(0, 0, midZ);
    camera.updateProjectionMatrix();
  }

  // ---------- plots ----------
  const plotGroup = new THREE.Group();
  scene.add(plotGroup);
  const plots = [];

  function computeSlotPosition(n){
    const side = n % 2 === 0 ? -1 : 1;
    const row = Math.floor(n/2);
    return { x: side*5.5, z: rowStartZ + row*zSpacing, row, side };
  }

  function createPlot(index, title, baseHex, accentHex){
    const { x, z, side } = computeSlotPosition(index);
    const g = new THREE.Group();
    g.position.set(x, 0, z);

    const base = new THREE.Mesh(
      new THREE.BoxGeometry(2.6, 0.15, 2.6),
      new THREE.MeshStandardMaterial({ color: 0x2a2634, roughness:1 })
    );
    base.position.y = 0.075;
    g.add(base);

    const facadeTex = makeNearestTexture(makeBuildingTexture(baseHex, accentHex));
    const building = new THREE.Mesh(
      new THREE.BoxGeometry(1.6, 1.6, 1.6),
      new THREE.MeshStandardMaterial({ map: facadeTex, roughness:0.9 })
    );
    building.position.y = 0.15 + 0.8;
    g.add(building);

    const roof = new THREE.Mesh(
      new THREE.ConeGeometry(1.3, 0.9, 4),
      new THREE.MeshStandardMaterial({ color: 0x1c1822, roughness:1 })
    );
    roof.rotation.y = Math.PI/4;
    roof.position.y = 0.15 + 1.6 + 0.45;
    g.add(roof);

    const lampGroup = new THREE.Group();
    lampGroup.position.set(-side*1.7, 0, 0.9);
    const pole = new THREE.Mesh(
      new THREE.CylinderGeometry(0.05, 0.06, 1.8, 6),
      new THREE.MeshStandardMaterial({ color: 0x1c1822, roughness:0.8 })
    );
    pole.position.y = 0.9;
    lampGroup.add(pole);

    const bulbMat = new THREE.MeshStandardMaterial({
      color: 0x3a3640, emissive: 0x000000, emissiveIntensity: 0, roughness:0.5
    });
    const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.16, 8, 8), bulbMat);
    bulb.position.y = 1.85;
    lampGroup.add(bulb);

    const glowLight = new THREE.PointLight(0xffcf8a, 0, 4);
    glowLight.position.y = 1.85;
    lampGroup.add(glowLight);
    g.add(lampGroup);

    plotGroup.add(g);
    return { group: g, building, roof, bulbMat, glowLight, lit:false, index, label: title };
  }

  // ---------- add-comic flow (mock — Stage 4 replaces the lighting logic) ----------
  const mockTitles = ['Untitled Draft', 'Working Copy', 'No Cover Yet', 'Placeholder Vol.', 'Draft Pages', 'Scan Batch'];
  let mockCounter = 0;
  function pickMockTitle(){
    mockCounter++;
    return `${mockTitles[(mockCounter-1) % mockTitles.length]} #${mockCounter}`;
  }

  function addComic(title){
    const n = plots.length;
    const rowsNeeded = Math.floor(n/2) + 1;
    if (rowsNeeded > builtRows){
      builtRows = rowsNeeded;
      rebuildGroundAndStreet(builtRows);
    }
    const hue = hashHue(title);
    const baseHex = hslToHex(hue, 42, 38);
    const accentHex = hslToHex((hue+40)%360, 55, 74);
    const plot = createPlot(n, title, baseHex, accentHex);

    // Stand-in only: lights immediately on placement to confirm the
    // plot exists. Stage 4 replaces this with lighting driven by
    // actual cover-image analysis (and likely a color pulled from
    // the cover instead of a fixed warm tone).
    plot.bulbMat.emissive.setHex(0xffcf8a);
    plot.bulbMat.emissiveIntensity = 1;
    plot.glowLight.intensity = 1.1;
    plot.lit = true;

    plots.push(plot);
    updateCameraFit();
    updateHud();
  }

  function updateHud(){
    const lit = plots.filter(p => p.lit).length;
    hudCount.textContent = `/ town — ${plots.length} plot${plots.length===1?'':'s'}, ${lit} lit`;
  }

  document.getElementById('addOne').addEventListener('click', () => addComic(pickMockTitle()));
  document.getElementById('addSix').addEventListener('click', () => {
    for (let i=0;i<6;i++) addComic(pickMockTitle());
  });

  // seed with one row so the town isn't empty on load
  for (let i=0;i<2;i++) addComic(pickMockTitle());

  // stars
  const starGeo = new THREE.BufferGeometry();
  const starCount = 160;
  const starPos = new Float32Array(starCount*3);
  for (let i=0;i<starCount;i++){
    starPos[i*3]=(Math.random()-0.5)*70;
    starPos[i*3+1]=6+Math.random()*16;
    starPos[i*3+2]=(Math.random()-0.5)*70;
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPos,3));
  const starMat = new THREE.PointsMaterial({
    size:0.1, map: makeNearestTexture(makeStarTexture()), transparent:true, depthWrite:false
  });
  scene.add(new THREE.Points(starGeo, starMat));

  // ---------- hover / click ----------
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  let hovered = null;

  window.addEventListener('mousemove', (e) => {
    const rect = renderer.domElement.getBoundingClientRect();
    mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    tooltip.style.left = (e.clientX + 14) + 'px';
    tooltip.style.top = (e.clientY + 14) + 'px';
  });
  window.addEventListener('click', (e) => {
    if (e.target.closest('#hud')) return;
    if (hovered) console.log('Would open reader for:', hovered.label, '(wired in Stage 5)');
  });

  function updateHover(){
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(plots.map(p => p.building));
    if (hits.length){
      const hitPlot = plots.find(p => p.building === hits[0].object);
      if (hovered !== hitPlot){
        if (hovered) hovered.group.scale.set(1,1,1);
        hovered = hitPlot;
      }
      hovered.group.scale.set(1.05,1.05,1.05);
      tooltip.textContent = hovered.label;
      tooltip.style.opacity = '1';
    } else {
      if (hovered) hovered.group.scale.set(1,1,1);
      hovered = null;
      tooltip.style.opacity = '0';
    }
  }

  function animate(){
    requestAnimationFrame(animate);
    updateHover();
    renderer.render(scene, camera);
  }
  animate();
})();
</script>

</body>
</html>
